<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Quiz Online</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{background:white;width:420px;padding:30px;border-radius:15px;box-shadow:0 15px 30px rgba(0,0,0,.2);text-align:center}
input{width:80%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ccc}
button{padding:12px 20px;border:none;border-radius:8px;background:#667eea;color:white;font-size:16px;cursor:pointer}
button:hover{background:#5563d9}
.option{display:block;margin:10px 0;padding:12px;border-radius:8px;border:1px solid #ddd;cursor:pointer;transition:.3s}
.option:hover{background:#f0f0ff}
.correct{background:#c8f7c5;border-color:#2ecc71}
.wrong{background:#f7c5c5;border-color:#e74c3c}
.progress{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin:15px 0}
.bar{height:100%;width:0%;background:#667eea;transition:.4s}
.score{font-size:18px;margin-top:10px}
</style>
</head>
<body>

<div class="card">
  <div id="start">
    <h2>Quiz Online</h2>
    <input type="text" id="player" placeholder="Tu nombre">
    <button onclick="startQuiz()">Comenzar</button>
  </div>

  <div id="game" style="display:none;">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <h3 id="question"></h3>
    <div id="options"></div>
    <div class="score">Puntaje: <span id="score">0</span></div>
  </div>

  <div id="end" style="display:none;">
    <h2>¡Juego terminado!</h2>
    <p>Puntaje final: <strong id="finalScore"></strong></p>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyRgmnRK6xCTx7xToIUjJpEDGtVnsIjs0A",
  authDomain: "quiz-online-1d69e.firebaseapp.com",
  databaseURL: "https://quiz-online-1d69e-default-rtdb.firebaseio.com",
  projectId: "quiz-online-1d69e",
  storageBucket: "quiz-online-1d69e.appspot.com",
  messagingSenderId: "660762522042",
  appId: "1:660762522042:web:6ff3a31017c4d121962d83"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<script>
const questions=[
 {q:"¿Capital de Francia?",o:["Madrid","París","Roma","Berlín"],a:1},
 {q:"5 x 6 = ?",o:["20","30","35","25"],a:1},
 {q:"Planeta rojo",o:["Marte","Venus","Júpiter","Saturno"],a:0},
 {q:"Lenguaje web",o:["HTML","Python","C++","Java"],a:0},
 {q:"Continentes",o:["5","6","7","8"],a:2}
];

let index=0,score=0,player="",locked=false;

function startQuiz(){
  player=document.getElementById("player").value.trim();
  if(player==="") return alert("Escribe tu nombre");

  db.ref("scores/"+player).set({
    name: player,
    score: 0
  });

  document.getElementById("start").style.display="none";
  document.getElementById("game").style.display="block";
  loadQuestion();
}

function loadQuestion(){
  locked=false;
  const q=questions[index];
  document.getElementById("question").innerText=q.q;
  const opt=document.getElementById("options");
  opt.innerHTML="";

  q.o.forEach((text,i)=>{
    const div=document.createElement("div");
    div.className="option";
    div.innerText=text;
    div.onclick=()=>selectOption(div,i);
    opt.appendChild(div);
  });

  document.getElementById("bar").style.width=(index/questions.length)*100+"%";
}

function selectOption(element,i){
  if(locked) return;
  locked=true;

  const correct=questions[index].a;
  const options=document.querySelectorAll(".option");

  if(i===correct){
    element.classList.add("correct");
    score++;
  } else {
    element.classList.add("wrong");
    options[correct].classList.add("correct");
  }

  document.getElementById("score").innerText=score;

  db.ref("scores/"+player).update({ score });

  setTimeout(()=>{
    index++;
    if(index<questions.length) loadQuestion();
    else finishQuiz();
  },800);
}

function finishQuiz(){
  document.getElementById("game").style.display="none";
  document.getElementById("end").style.display="block";
  document.getElementById("finalScore").innerText=score;

  db.ref("scores/"+player).update({ score });
}
</script>

</body>
</html>
